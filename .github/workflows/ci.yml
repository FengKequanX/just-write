name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun run setup
      - run: bun run check:contracts
      - run: bun run test:unit
      - run: bun plugins/just-write/skills/post-to-xhs/scripts/md-to-xhs.ts --help
      - run: bun plugins/just-write/skills/sync-to-douyin/scripts/douyin-note.ts --help
      - run: bun plugins/just-write/skills/baoyu-post-to-wechat/scripts/wechat-api.ts --help
      - run: bun plugins/just-write/skills/just-write/scripts/workflow-state.ts --help
  xhs-render-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun run setup
      - run: bun run test:render
      - run: bun run qa:render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-review
          path: .tmp-xhs-preview/skill-review/v160/visual
          if-no-files-found: ignore
